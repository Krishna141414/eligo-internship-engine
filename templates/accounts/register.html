{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth__card">
    <h1 class="h3 mb-0">Create your student account</h1>
    <p class="auth__tagline">Eligibility-first, explainable internship matching</p>
    <form method="post" novalidate>{% csrf_token %}
      {% include "partials/form.html" %}
      <button type="submit" class="btn btn-primary w-100">Create account</button>
    </form>
    <p class="mt-3 mb-0 small">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
