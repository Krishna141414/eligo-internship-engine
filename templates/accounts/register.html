{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <h1 class="h3">Create your student account</h1>
  <p class="text-muted">Eligibility-first, explainable internship matching</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include "partials/form.html" %}
    <button type="submit" class="btn btn-primary w-100">Create account</button>
  </form>
  <p class="mt-3 small">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div></div>
{% endblock %}
