{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth__card">
    <h1 class="h3 mb-0">Log in to Eligo</h1>
    <p class="auth__tagline">Eligibility-first, explainable internship matching</p>
    <form method="post" novalidate>{% csrf_token %}
      {% include "partials/form.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="mt-3 mb-0 small">New student? <a href="{% url 'accounts:register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
