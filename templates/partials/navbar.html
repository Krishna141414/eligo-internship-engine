{% load eligo_ui %}
<header class="app-topbar navbar navbar-expand-lg p-0">
  <div class="app-topbar__inner">
    {% include "partials/wordmark.html" %}
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#student-nav" aria-controls="student-nav" aria-expanded="false">
      <i class="bi bi-list" aria-hidden="true"></i><span class="visually-hidden">Open menu</span></button>
    <nav class="collapse navbar-collapse" id="student-nav" aria-label="Main">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{% url 'students:dashboard' %}"{% current 'students:dashboard' %}>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'students:profile_edit' %}"{% current 'students:profile_edit' 'students:account_edit' %}>Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'internships:list' %}"{% current 'internships:list' 'internships:detail' %}>Internships</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'assessments:list' %}"{% current 'assessments:*' %}>Assessments</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'recommendations:list' %}"{% current 'recommendations:list' 'recommendations:detail' %}>Recommendations</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'recommendations:job_role' %}"{% current 'recommendations:job_role' %}>Job role</a></li>
      </ul>
      <div class="app-user">
        <span class="app-user__name">{{ user.name }}</span>
        <a class="btn btn-link btn-sm" href="{% url 'accounts:password_change' %}"{% current 'accounts:password_change' %}>Change password</a>
        <form method="post" action="{% url 'accounts:logout' %}" class="m-0">{% csrf_token %}<button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button></form>
      </div>
    </nav>
  </div>
</header>
