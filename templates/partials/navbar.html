<nav class="navbar navbar-expand-lg border-bottom bg-white">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'accounts:home' %}">Eligo</a>
    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-3">
      <span class="text-muted small">{{ user.name }}</span>
      <a class="small" href="{% url 'accounts:password_change' %}">Change password</a>
      <form method="post" action="{% url 'accounts:logout' %}" class="m-0">{% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline-secondary">Log out</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
