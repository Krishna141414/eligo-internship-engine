<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
      <title id="architecture-title">How Eligo fits together</title>
      <desc id="architecture-desc">A notebook cleans the public datasets and trains the models with the shared ml_core package, saving verified artifacts; the offline Django app loads them to gate and rank internships after a server-timed assessment, predicts a job role from career skills, and can ask a local LLM for an optional second opinion.</desc>
      <defs>
      <style>#architecture-root { --color-paper:  #F6F8FB;
      --color-ink:    #0B1F3A;
      --color-muted:  #5B6577;
      --font-sans:    'Geist', 'Inter', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', Georgia, serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .scroll { overflow-x: auto; }</style>
        <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5B6577"/></marker>
        <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9A6410"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F6F8FB"/>

      <!-- Zones (before arrows and nodes) -->
      <rect x="24" y="40" width="448" height="120" rx="8" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
      <rect x="40" y="44" width="112" height="12" rx="2" fill="#F6F8FB"/>
      <text x="96" y="53" fill="#4E596B" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">NOTEBOOK, RUN ONCE</text>

      <rect x="24" y="200" width="632" height="280" rx="8" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
      <rect x="40" y="204" width="188" height="12" rx="2" fill="#F6F8FB"/>
      <text x="134" y="213" fill="#4E596B" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DJANGO APP + SQLITE, OFFLINE</text>

      <!-- Arrows (behind boxes) -->
      <line x1="216" y1="104" x2="280" y2="104" stroke="#5B6577" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <line x1="456" y1="104" x2="712" y2="104" stroke="#5B6577" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <line x1="184" y1="280" x2="248" y2="280" stroke="#5B6577" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <line x1="392" y1="280" x2="456" y2="280" stroke="#9A6410" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
      <!-- artifacts -> ranking (port x=728) -->
      <path d="M 728,136 V 264 Q 728,272 720,272 H 616" fill="none" stroke="#5B6577" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <!-- artifacts -> job-role model (port x=760), between the two rows -->
      <path d="M 760,136 V 336 Q 760,344 752,344 H 136 Q 128,344 128,352 V 376" fill="none" stroke="#5B6577" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <!-- student -> job-role model -->
      <line x1="96" y1="312" x2="96" y2="376" stroke="#5B6577" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <!-- ranking -> local LLM: dashed, async; hops over the model path at y=344 -->
      <path d="M 536,312 V 336 a 8,8 0 0,0 0,16 V 376" fill="none" stroke="#5B6577" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>

      <!-- Arrow labels (masks before nodes) -->
      <rect x="228" y="86" width="40" height="12" rx="2" fill="#F6F8FB"/>
      <text x="248" y="95" fill="#5B6577" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CLEAN</text>
      <rect x="544" y="86" width="80" height="12" rx="2" fill="#F6F8FB"/>
      <text x="584" y="95" fill="#5B6577" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TRAIN + SAVE</text>
      <rect x="200" y="262" width="32" height="12" rx="2" fill="#F6F8FB"/>
      <text x="216" y="271" fill="#5B6577" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXAM</text>
      <rect x="396" y="262" width="56" height="12" rx="2" fill="#F6F8FB"/>
      <text x="424" y="271" fill="#9A6410" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCORE&gt;60%</text>
      <rect x="688" y="194" width="32" height="12" rx="2" fill="#F6F8FB"/>
      <text x="704" y="203" fill="#5B6577" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOAD</text>
      <rect x="644" y="326" width="56" height="12" rx="2" fill="#F6F8FB"/>
      <text x="672" y="335" fill="#5B6577" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RF MODEL</text>
      <rect x="44" y="338" width="44" height="12" rx="2" fill="#F6F8FB"/>
      <text x="66" y="347" fill="#5B6577" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SKILLS</text>
      <rect x="544" y="318" width="72" height="12" rx="2" fill="#F6F8FB"/>
      <text x="580" y="327" fill="#5B6577" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOP 3, ASYNC</text>

      <!-- Node: Public datasets (input) -->
      <rect x="40" y="72" width="176" height="64" rx="6" fill="#F6F8FB"/>
      <rect x="40" y="72" width="176" height="64" rx="6" fill="#5b6577" stroke="#4E596B" stroke-width="1" fill-opacity="0.10"/>
      <rect x="48" y="80" width="32" height="12" rx="2" fill="none" stroke="#4e596b" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="64" y="89" fill="#4E596B" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="128" y="108" fill="#0B1F3A" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, sans-serif" text-anchor="middle">Public datasets</text>
      <text x="128" y="124" fill="#5B6577" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Kaggle + Mendeley</text>

      <!-- Node: Notebook + ml_core (backend) -->
      <rect x="280" y="72" width="176" height="64" rx="6" fill="#F6F8FB"/>
      <rect x="280" y="72" width="176" height="64" rx="6" fill="#ffffff" stroke="#0B1F3A" stroke-width="1"/>
      <rect x="288" y="80" width="48" height="12" rx="2" fill="none" stroke="#0b1f3a" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="312" y="89" fill="#0B1F3A" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">JUPYTER</text>
      <text x="368" y="108" fill="#0B1F3A" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, sans-serif" text-anchor="middle">Notebook + ml_core</text>
      <text x="368" y="124" fill="#5B6577" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">eligo_engine.ipynb</text>

      <!-- Node: artifacts/ (focal 1) -->
      <rect x="712" y="72" width="192" height="64" rx="6" fill="#F6F8FB"/>
      <rect x="712" y="72" width="192" height="64" rx="6" fill="#9a6410" stroke="#9A6410" stroke-width="1" fill-opacity="0.08"/>
      <rect x="720" y="80" width="40" height="12" rx="2" fill="none" stroke="#9a6410" stroke-width="0.8" stroke-opacity="0.50"/>
      <text x="740" y="89" fill="#9A6410" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="808" y="108" fill="#0B1F3A" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, sans-serif" text-anchor="middle">artifacts/</text>
      <text x="808" y="124" fill="#5B6577" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SHA-256 manifest</text>

      <!-- Node: Student (input) -->
      <rect x="40" y="248" width="144" height="64" rx="6" fill="#F6F8FB"/>
      <rect x="40" y="248" width="144" height="64" rx="6" fill="#5b6577" stroke="#4E596B" stroke-width="1" fill-opacity="0.10"/>
      <rect x="48" y="256" width="32" height="12" rx="2" fill="none" stroke="#4e596b" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="64" y="265" fill="#4E596B" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="112" y="284" fill="#0B1F3A" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, sans-serif" text-anchor="middle">Student</text>
      <text x="112" y="300" fill="#5B6577" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">browser</text>

      <!-- Node: Assessment (backend) -->
      <rect x="248" y="248" width="144" height="64" rx="6" fill="#F6F8FB"/>
      <rect x="248" y="248" width="144" height="64" rx="6" fill="#ffffff" stroke="#0B1F3A" stroke-width="1"/>
      <rect x="256" y="256" width="32" height="12" rx="2" fill="none" stroke="#0b1f3a" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="272" y="265" fill="#0B1F3A" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXAM</text>
      <text x="320" y="284" fill="#0B1F3A" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, sans-serif" text-anchor="middle">Assessment</text>
      <text x="320" y="300" fill="#5B6577" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">server-timed MCQ</text>

      <!-- Node: Gates + hybrid rank (focal 2) -->
      <rect x="456" y="248" width="160" height="64" rx="6" fill="#F6F8FB"/>
      <rect x="456" y="248" width="160" height="64" rx="6" fill="#9a6410" stroke="#9A6410" stroke-width="1" fill-opacity="0.08"/>
      <rect x="464" y="256" width="32" height="12" rx="2" fill="none" stroke="#9a6410" stroke-width="0.8" stroke-opacity="0.50"/>
      <text x="480" y="265" fill="#9A6410" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RANK</text>
      <text x="536" y="284" fill="#0B1F3A" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, sans-serif" text-anchor="middle">Gates + hybrid rank</text>
      <text x="536" y="300" fill="#5B6577" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.35 / 0.40 / 0.25</text>

      <!-- Node: Job-role model (backend) -->
      <rect x="40" y="376" width="144" height="64" rx="6" fill="#F6F8FB"/>
      <rect x="40" y="376" width="144" height="64" rx="6" fill="#ffffff" stroke="#0B1F3A" stroke-width="1"/>
      <rect x="48" y="384" width="24" height="12" rx="2" fill="none" stroke="#0b1f3a" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="60" y="393" fill="#0B1F3A" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ML</text>
      <text x="112" y="412" fill="#0B1F3A" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, sans-serif" text-anchor="middle">Job-role model</text>
      <text x="112" y="428" fill="#5B6577" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Random Forest</text>

      <!-- Node: Local LLM (optional) -->
      <rect x="456" y="376" width="160" height="64" rx="6" fill="#F6F8FB"/>
      <rect x="456" y="376" width="160" height="64" rx="6" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
      <rect x="464" y="384" width="28" height="12" rx="2" fill="none" stroke="#0b1f3a" stroke-width="0.8" stroke-opacity="0.22"/>
      <text x="478" y="393" fill="#4E596B" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
      <text x="536" y="412" fill="#0B1F3A" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, sans-serif" text-anchor="middle">Local LLM</text>
      <text x="536" y="428" fill="#5B6577" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Ollama qwen3:4b</text>

      <!-- Legend strip -->
      <line x1="24" y1="504" x2="936" y2="504" stroke="#0b1f3a" stroke-width="0.8" stroke-opacity="0.10"/>
      <text x="24" y="524" fill="#5B6577" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="24" y="540" width="14" height="10" rx="2" fill="#9a6410" stroke="#9A6410" stroke-width="1" fill-opacity="0.08"/>
      <text x="44" y="548" fill="#5B6577" font-size="8.5" font-family="'Geist', 'Inter', system-ui, sans-serif">Focal: saved models, ranking</text>
      <rect x="188" y="540" width="14" height="10" rx="2" fill="#ffffff" stroke="#0B1F3A" stroke-width="1"/>
      <text x="208" y="548" fill="#5B6577" font-size="8.5" font-family="'Geist', 'Inter', system-ui, sans-serif">Component</text>
      <rect x="284" y="540" width="14" height="10" rx="2" fill="#5b6577" stroke="#4E596B" stroke-width="1" fill-opacity="0.10"/>
      <text x="304" y="548" fill="#5B6577" font-size="8.5" font-family="'Geist', 'Inter', system-ui, sans-serif">Data or person</text>
      <rect x="396" y="540" width="14" height="10" rx="2" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
      <text x="416" y="548" fill="#5B6577" font-size="8.5" font-family="'Geist', 'Inter', system-ui, sans-serif">Optional</text>
      <line x1="484" y1="545" x2="512" y2="545" stroke="#9A6410" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
      <text x="520" y="548" fill="#5B6577" font-size="8.5" font-family="'Geist', 'Inter', system-ui, sans-serif">Eligibility gate (score above 60%)</text>
      <line x1="684" y1="545" x2="712" y2="545" stroke="#5B6577" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
      <text x="720" y="548" fill="#5B6577" font-size="8.5" font-family="'Geist', 'Inter', system-ui, sans-serif">Async, never blocks the page</text>
    </svg>
